name: Test and package

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      package_platform:
        description: Package platform
        required: true
        default: all
        type: choice
        options:
          - all
          - macos
          - windows

permissions:
  contents: read

jobs:
  test:
    name: Test on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - run: node --test apps/desktop/tests/updates.test.cjs

  package:
    name: Package for ${{ matrix.os }}
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
            artifact: CS2-Settings-Generator-macOS
          - os: windows-latest
            platform: windows
            artifact: CS2-Settings-Generator-Windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: tauri-apps/tauri-action@v0
        if: inputs.package_platform == 'all' || inputs.package_platform == matrix.platform
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop/src-tauri
      - name: Collect macOS builds
        if: (inputs.package_platform == 'all' || inputs.package_platform == matrix.platform) && runner.os == 'macOS'
        run: ./script/build_release.sh --collect-only
      - name: Collect Windows builds
        if: (inputs.package_platform == 'all' || inputs.package_platform == matrix.platform) && runner.os == 'Windows'
        shell: pwsh
        run: ./script/build_release_windows.ps1 -CollectOnly
      - uses: actions/upload-artifact@v7
        if: inputs.package_platform == 'all' || inputs.package_platform == matrix.platform
        with:
          name: ${{ matrix.artifact }}
          path: Builds
          if-no-files-found: error
