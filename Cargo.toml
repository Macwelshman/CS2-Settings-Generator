[workspace]
members = [
    "crates/cs2-settings-cli",
    "crates/cs2-settings-core",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/Macwelshman/CS2-Settings-Generator"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ufbx = "0.11.2"
walkdir = "2.5"

